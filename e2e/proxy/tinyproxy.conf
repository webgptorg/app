# tinyproxy as a corporate forward proxy for the connect-proxy scenario (X-02). It serves only the engine LAN and
# tunnels only to port 443; it never sees inside a tunnel, since CONNECT only relays bytes.
Port 3128
Listen 0.0.0.0
Timeout 600
Allow 10.89.232.0/24
ConnectPort 443
# One line per CONNECT as it starts, on stdout (`-d` keeps tinyproxy in the foreground); the test reads them.
LogLevel Connect
MaxClients 100
