name: CI

# Pull requests run only the cheap jobs (`changes`, `workflows`) unless they carry the `run-ci` label; with it, the jobs
# their changes reach. Main has no run per push: the nightly (nightly.yml) runs everything once main moved, and a
# manual run does too. Local `bun run check` is the gate before merging.
on:
  # ready_for_review: a draft runs nothing (see `changes`), so marking it ready must start its run. labeled: adding
  # `run-ci` starts the full run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # The nightly full run on main (nightly.yml), and a full run by hand.
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

# A pull request cancels its superseded run; the nightly and a manual run each have their own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs and nothing is cached between runs (spec, Security hardening item 10).
# A pull request with `run-ci` runs only the jobs its changes reach (scripts/ci-scope.ts); the nightly and a manual run
# run every job. Each job's `if` reads only the `changes` outputs.
jobs:
  # Skipped for a draft, and with it every job below; `ci-passed` then fails, so a draft never looks green.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
      check: ${{ steps.scope.outputs.check }}
      workspaces: ${{ steps.scope.outputs.workspaces }}
      jobs: ${{ steps.scope.outputs.jobs }}
    steps:
      # A pull request needs depth 2: its merge commit and both parents, so HEAD^1 is the base it merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Reads the event from GITHUB_EVENT_NAME: the nightly and a manual run run everything.
      - id: scope
        run: node scripts/ci-scope.ts changes

  check:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Formatting-only changes need the root tools, not every app's runtime and browser dependencies.
      - name: Install check dependencies
        env:
          CHECK_MODE: ${{ needs.changes.outputs.check }}
        run: |
          if [ "$CHECK_MODE" = format ]; then
            bun install --frozen-lockfile --filter './'
          else
            bun install --frozen-lockfile
          fi
      # The root `check` script, so whatever runs locally runs in CI and new checks cannot be forgotten here: whole
      # for a full run, with tests only for the affected workspaces, or only Prettier and the plan and engine guide
      # checks when no workspace is affected.
      - name: bun run check
        env:
          CHECK_MODE: ${{ needs.changes.outputs.check }}
          WORKSPACES: ${{ needs.changes.outputs.workspaces }}
        run: node scripts/ci-scope.ts check

  # The built engine-ui bundle in Chromium under the engine's exact CSP (U-01). Separate from `check` because it needs
  # a browser; nothing is cached, not even the Bun binary.
  engine-ui-csp:
    needs: changes
    if: needs.changes.outputs.full == 'true' && contains(fromJSON(needs.changes.outputs.jobs), 'engine-ui-csp')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --filter './' --filter '@ptbk/engine-ui...'
      - name: Install Chromium
        working-directory: apps/engine-ui
        run: bunx --no-install playwright install --with-deps chromium
      # A failing PR is already blocked; stop at the first browser failure. The nightly keeps every diagnostic.
      - run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args+=(--max-failures=1); fi
          bun run --filter @ptbk/engine-ui test:csp "${args[@]}"

  # The built dashboard (SPA and Worker in workerd) in Chromium under its production CSP, with a virtual WebAuthn
  # authenticator for the sign-up, sign-in and recovery flows (D-09).
  dashboard-csp:
    needs: changes
    if: needs.changes.outputs.full == 'true' && contains(fromJSON(needs.changes.outputs.jobs), 'dashboard-csp')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --filter './' --filter '@ptbk/dashboard...'
      - run: bun run --filter @ptbk/dashboard generate
      - name: Install Chromium
        working-directory: apps/dashboard
        run: bunx --no-install playwright install --with-deps chromium
      # A failing PR is already blocked; stop at the first browser failure. The nightly keeps every diagnostic.
      - run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args+=(--max-failures=1); fi
          bun run --filter @ptbk/dashboard test:csp "${args[@]}"

  # The owner's setup and passkey sign-in on the mock engine's reference gateway pages, in Chromium with a virtual
  # authenticator, through an in-process relay under the engine's CSP (M-08).
  mock-engine-browser:
    needs: changes
    if: needs.changes.outputs.full == 'true' && contains(fromJSON(needs.changes.outputs.jobs), 'mock-engine-browser')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --filter './' --filter '@ptbk/mock-engine...'
      - name: Install Chromium
        working-directory: apps/mock-engine
        run: bunx --no-install playwright install --with-deps chromium
      # A failing PR is already blocked; stop at the first browser failure. The nightly keeps every diagnostic.
      - run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args+=(--max-failures=1); fi
          bun run --filter @ptbk/mock-engine test:browser "${args[@]}"

  # Browsers through both relays to the mock engine in Docker Compose (X-01). Separate from `check`, which never needs
  # Docker. Every image is built from scratch on each run: no actions/cache, no Buildx cache.
  e2e:
    needs: changes
    if: needs.changes.outputs.full == 'true' && contains(fromJSON(needs.changes.outputs.jobs), 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Needs no install on the runner: the driver uses only node: modules, and the images install inside Docker.
      # Firefox runs in the nightly and manual runs only.
      - run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args+=(--project=chromium); fi
          bun run --filter @ptbk/e2e e2e "${args[@]}"
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Every conformance suite against mock engines the harness starts: it plays the dashboard, the relays and the release
  # store on loopback and reaches the engine API through its fake relay, over TLS, as a browser would. `*.localhost`
  # names resolve to loopback (systemd-resolved), so no DNS or hosts file is touched.
  conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' && contains(fromJSON(needs.changes.outputs.jobs), 'conformance')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --filter './' --filter '@ptbk/mock-engine...' --filter '@ptbk/conformance...'
      - name: Build the mock engine and the conformance CLI
        run: |
          bun run --filter @ptbk/mock-engine build
          bun run --filter @ptbk/conformance build
      # The production heartbeat cadence (60 s) check mostly waits, so it runs beside the suites instead of after them;
      # every engine and fake service the harness starts listens on its own ephemeral port. A seeded team, so the
      # engine API checks that need existing data (an infected file, an ended trigger) have it.
      - name: Run every suite, and the production heartbeat cadence, against mock engines the harness starts
        run: |
          node packages/conformance/dist/ptbk-conformance.js \
            --engine-cmd "MOCK_SCENARIO=empty MOCK_PASSKEYS=seeded exec node $GITHUB_WORKSPACE/apps/mock-engine/dist/main.mjs" \
            --filter heartbeat.cadence.interval --seed 1 --report junit --out conformance-cadence-report.xml \
            > "$RUNNER_TEMP/conformance-cadence.log" 2>&1 &
          cadence=$!
          status=0
          node packages/conformance/dist/ptbk-conformance.js \
            --engine-cmd "MOCK_PROFILE=full MOCK_SCENARIO=small-team MOCK_SEED=1 MOCK_PASSKEYS=seeded MOCK_HEARTBEAT_INTERVAL_S=2 exec node $GITHUB_WORKSPACE/apps/mock-engine/dist/main.mjs" \
            --engine-production-cmd "NODE_ENV=production MOCK_SCENARIO=small-team MOCK_HEARTBEAT_INTERVAL_S=2 exec node $GITHUB_WORKSPACE/apps/mock-engine/dist/main.mjs" \
            --heartbeat-interval-s 2 --mock-control --seed 1 --report junit --out conformance-report.xml || status=$?
          wait "$cadence" || status=$?
          echo "::group::Heartbeat cadence"
          cat "$RUNNER_TEMP/conformance-cadence.log"
          echo "::endgroup::"
          exit "$status"
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: |
            conformance-report.xml
            conformance-cadence-report.xml
          retention-days: 7
          if-no-files-found: ignore

  # Offline checks for infra/ (I-01): tofu fmt, validate and test (mocked providers, no backend, no credential), then
  # the rendered relay host user data through cloud-init, nft, systemd-analyze, sshd, unbound and ShellCheck. The
  # script runs everything in pinned containers, so it runs the same way on a laptop with Docker.
  infra:
    needs: changes
    if: needs.changes.outputs.full == 'true' && contains(fromJSON(needs.changes.outputs.jobs), 'infra')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: infra/relay/scripts/check.sh

  # `promtool check metrics` over what the relay's GET /metrics answers after routing a connection (I-04).
  relay-metrics:
    needs: changes
    if: needs.changes.outputs.full == 'true' && contains(fromJSON(needs.changes.outputs.jobs), 'relay-metrics')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --filter './' --filter '@ptbk/relay...'
      - run: bun run --filter @ptbk/relay check:metrics

  # The relay host's real user data booted in a Debian 13 cloud image under KVM, with secrets placed and a test relay
  # image deployed the way the README and I-03 do it; the relay certificate issued by the host's own unit from a local
  # Pebble through a Cloudflare API and DNS stand-in; then verify.sh, port scans from inside and outside the SSH
  # allowlist (no deploy user or key: relays pull their deploys), and verify.sh failing on password SSH (I-01).
  relay-host-vm:
    needs: changes
    if: needs.changes.outputs.full == 'true' && contains(fromJSON(needs.changes.outputs.jobs), 'relay-host-vm')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --filter './' --filter '@ptbk/relay...'
      - run: bun run --filter @ptbk/relay build
      - name: Install QEMU and the test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils nmap
      - name: Boot the relay host and check it
        run: sudo VM_TEST_WORK="$RUNNER_TEMP/relay-vm" infra/relay/test/vm-test.sh
      - name: Upload the VM console log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-vm-console
          path: ${{ runner.temp }}/relay-vm/console.log
          retention-days: 7
          if-no-files-found: ignore

  # Two relay hosts in privileged containers (systemd, rootful Podman, the user data's files, deploy timer and cosign),
  # a registry with their deploy tags and a fake Sigstore: signature refusals, the downgrade guard, a rolling deploy by
  # tag and the rollback of a broken image (I-03).
  relay-deploy:
    needs: changes
    if: needs.changes.outputs.full == 'true' && contains(fromJSON(needs.changes.outputs.jobs), 'relay-deploy')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --filter './' --filter '@ptbk/mock-engine...' --filter '@ptbk/relay...'
      - run: bun run --filter @ptbk/mock-engine build
      - run: infra/relay/test/deploy-test.sh

  workflows:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows with zizmor
        run: pipx run zizmor==1.30.1 --min-severity medium .github/workflows

  # The one status to require for main: a job skipped because the change does not reach it, or because the pull
  # request has no `run-ci`, counts as passed; a failed or cancelled one fails this, and so does a skipped `changes`
  # (a draft), because GitHub reports a skipped job as passed.
  ci-passed:
    if: always()
    needs:
      - changes
      - check
      - engine-ui-csp
      - dashboard-csp
      - mock-engine-browser
      - e2e
      - conformance
      - infra
      - relay-metrics
      - relay-host-vm
      - relay-deploy
      - workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          echo "$RESULTS"
          if [ "$CHANGES" != success ]; then
            echo "::error::CI did not run: a draft pull request runs it once it is marked ready for review"
            exit 1
          fi
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
          if [ "$FULL" != true ]; then
            echo "::notice::Full CI not requested: only the cheap jobs ran. Add the run-ci label to run it."
          fi
