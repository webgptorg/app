name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs and nothing is cached between runs (spec, Security hardening item 10).
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # One step on purpose: whatever `check` runs locally runs in CI, so new checks cannot be forgotten here.
      - run: bun run check

  # The built engine-ui bundle in Chromium under the engine's exact CSP (U-01). Separate from `check` because it needs
  # a browser; nothing is cached, not even the Bun binary.
  engine-ui-csp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/engine-ui
        run: bunx --no-install playwright install --with-deps chromium
      - run: bun run --filter @ptbk/engine-ui test:csp

  # The built dashboard (SPA and Worker in workerd) in Chromium under its production CSP, with a virtual WebAuthn
  # authenticator for the sign-up, sign-in and recovery flows (D-09).
  dashboard-csp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --filter @ptbk/dashboard generate
      - name: Install Chromium
        working-directory: apps/dashboard
        run: bunx --no-install playwright install --with-deps chromium
      - run: bun run --filter @ptbk/dashboard test:csp

  # The owner's setup and passkey sign-in on the mock engine's reference gateway pages, in Chromium with a virtual
  # authenticator, through an in-process relay under the engine's CSP (M-08).
  mock-engine-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/mock-engine
        run: bunx --no-install playwright install --with-deps chromium
      - run: bun run --filter @ptbk/mock-engine test:browser

  # Browsers through both relays to the mock engine in Docker Compose (X-01). Separate from `check`, which never needs
  # Docker. Every image is built from scratch on each run: no actions/cache, no Buildx cache.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Needs no install on the runner: the driver uses only node: modules, and the images install inside Docker.
      - run: bun run --filter @ptbk/e2e e2e
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Every conformance suite against mock engines the harness starts: it plays the dashboard, the relays and the release
  # store on loopback and reaches the engine API through its fake relay, over TLS, as a browser would. `*.localhost`
  # names resolve to loopback (systemd-resolved), so no DNS or hosts file is touched.
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Build the mock engine and the conformance CLI
        run: |
          bun run --filter @ptbk/mock-engine build
          bun run --filter @ptbk/conformance build
      # A seeded team, so the engine API checks that need existing data (an infected file, an ended trigger) have it.
      - name: Run every suite against mock engines the harness starts
        run: |
          node packages/conformance/dist/ptbk-conformance.js \
            --engine-cmd "MOCK_SCENARIO=small-team MOCK_SEED=1 MOCK_HEARTBEAT_INTERVAL_S=2 exec node $GITHUB_WORKSPACE/apps/mock-engine/dist/main.mjs" \
            --heartbeat-interval-s 2 --mock-control --seed 1 --report junit --out conformance-report.xml
      - name: Check the production heartbeat cadence (60 s) of a mock engine the harness starts
        run: |
          node packages/conformance/dist/ptbk-conformance.js \
            --engine-cmd "MOCK_SCENARIO=empty exec node $GITHUB_WORKSPACE/apps/mock-engine/dist/main.mjs" \
            --filter heartbeat.cadence.interval --seed 1 --report junit --out conformance-cadence-report.xml
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: |
            conformance-report.xml
            conformance-cadence-report.xml
          retention-days: 7
          if-no-files-found: ignore

  # Offline checks for infra/ (I-01): tofu fmt, validate and test (mocked providers, no backend, no credential), then
  # the rendered relay host user data through cloud-init, nft, systemd-analyze, sshd, unbound and ShellCheck. The
  # script runs everything in pinned containers, so it runs the same way on a laptop with Docker.
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: infra/relay/scripts/check.sh

  # `promtool check metrics` over what the relay's GET /metrics answers after routing a connection (I-04).
  relay-metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --filter @ptbk/relay check:metrics

  # The relay host's real user data booted in a Debian 13 cloud image under KVM, with secrets placed and a test relay
  # image deployed the way the README and I-03 do it; the relay certificate issued by the host's own unit from a local
  # Pebble through a Cloudflare API and DNS stand-in; then verify.sh, port scans from inside and outside the SSH
  # allowlist (no deploy user or key: relays pull their deploys), and verify.sh failing on password SSH (I-01).
  relay-host-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --filter @ptbk/relay build
      - name: Install QEMU and the test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils nmap
      - name: Boot the relay host and check it
        run: sudo VM_TEST_WORK="$RUNNER_TEMP/relay-vm" infra/relay/test/vm-test.sh
      - name: Upload the VM console log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-vm-console
          path: ${{ runner.temp }}/relay-vm/console.log
          retention-days: 7
          if-no-files-found: ignore

  # Two relay hosts in privileged containers (systemd, rootful Podman, the user data's files, deploy timer and cosign),
  # a registry with their deploy tags and a fake Sigstore: signature refusals, the downgrade guard, a rolling deploy by
  # tag and the rollback of a broken image (I-03).
  relay-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --filter @ptbk/mock-engine build
      - run: infra/relay/test/deploy-test.sh

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows with zizmor
        run: pipx run zizmor==1.30.1 --min-severity medium .github/workflows
