name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs and nothing is cached between runs (spec, Security hardening item 10).
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # One step on purpose: whatever `check` runs locally runs in CI, so new checks cannot be forgotten here.
      - run: bun run check

  # The built engine-ui bundle in Chromium under the engine's exact CSP (U-01). Separate from `check` because it needs
  # a browser; nothing is cached, not even the Bun binary.
  engine-ui-csp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/engine-ui
        run: bunx --no-install playwright install --with-deps chromium
      - run: bun run --filter @ptbk/engine-ui test:csp

  # The built dashboard (SPA and Worker in workerd) in Chromium under its production CSP, with a virtual WebAuthn
  # authenticator for the sign-up, sign-in and recovery flows (D-09).
  dashboard-csp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --filter @ptbk/dashboard generate
      - name: Install Chromium
        working-directory: apps/dashboard
        run: bunx --no-install playwright install --with-deps chromium
      - run: bun run --filter @ptbk/dashboard test:csp

  # Browsers through both relays to the mock engine in Docker Compose (X-01). Separate from `check`, which never needs
  # Docker. Every image is built from scratch on each run: no actions/cache, no Buildx cache.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Needs no install on the runner: the driver uses only node: modules, and the images install inside Docker.
      - run: bun run --filter @ptbk/e2e e2e
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The engine API conformance suite (C-05) against the mock engine behind a real relay, over TLS, as a browser would
  # reach it. `*.localhost` names resolve to loopback (systemd-resolved), so no DNS or hosts file is touched.
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENGINE_DOMAIN: engine.localhost
      # Not RELAY_*: the relay refuses environment names it does not know.
      CONFORMANCE_RELAY: relay.localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Build the relay, the mock engine and the conformance CLI
        run: |
          bun run --filter @ptbk/relay build
          bun run --filter @ptbk/mock-engine build
          bun run --filter @ptbk/conformance build
      - name: Start a relay and the mock engine (seed 1)
        run: |
          STACK="$RUNNER_TEMP/conformance"
          install -d -m 700 "$STACK" "$STACK/engine"
          cd "$STACK"
          # A throwaway CA for the relay's own TLS listener; the mock engine trusts it for the tunnel.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj /CN=conformance-relay-ca \
            -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign \
            -keyout relay-ca.key -out relay-ca.pem
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj "/CN=$CONFORMANCE_RELAY" -keyout relay.key -out relay.csr
          printf 'subjectAltName=DNS:%s\nextendedKeyUsage=serverAuth\n' "$CONFORMANCE_RELAY" > relay.ext
          openssl x509 -req -in relay.csr -CA relay-ca.pem -CAkey relay-ca.key -CAcreateserial -days 1 -extfile relay.ext -out relay.pem
          (cd "$GITHUB_WORKSPACE/apps/mock-engine" && PTBK_DATA_DIR="$STACK/engine" PTBK_ENGINE_DOMAIN="$ENGINE_DOMAIN" bun run --silent identity) > identity.json
          node -e 'const i = require("./identity.json"); require("fs").writeFileSync("registry.json", JSON.stringify({ v: 1, engines: [{ engineId: i.engineId, enginePublicKey: i.enginePublicKey, hostnames: [i.hostname], claims: [], status: "active" }] }))'
          RELAY_HOSTNAME="$CONFORMANCE_RELAY" RELAY_LISTEN_HOST=127.0.0.1 RELAY_LISTEN_PORT=8443 RELAY_ENGINE_DOMAIN="$ENGINE_DOMAIN" \
            RELAY_TLS_CERT_FILE=relay.pem RELAY_TLS_KEY_FILE=relay.key RELAY_REGISTRY_KIND=static RELAY_REGISTRY_FILE=registry.json \
            nohup node "$GITHUB_WORKSPACE/apps/relay/dist/main.mjs" > relay.log 2>&1 &
          PTBK_DATA_DIR="$STACK/engine" PTBK_ENGINE_DOMAIN="$ENGINE_DOMAIN" PTBK_RELAYS="wss://$CONFORMANCE_RELAY:8443" \
            MOCK_EXTRA_CA_FILE=relay-ca.pem MOCK_SEED=1 MOCK_SCENARIO=small-team MOCK_CONTROL=enabled MOCK_CONTROL_PORT=4480 \
            nohup node "$GITHUB_WORKSPACE/apps/mock-engine/dist/main.mjs" > mock-engine.log 2>&1 &
          hostname=$(node -p 'require("./identity.json").hostname')
          for _ in $(seq 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --cacert engine/dev-ca/ca-cert.pem "https://$hostname:8443/api/v1/engine" || true)
            if [ "$status" = 401 ]; then exit 0; fi
            sleep 1
          done
          echo "the mock engine did not answer through the relay" >&2
          exit 1
      - name: Run the conformance suite
        run: |
          STACK="$RUNNER_TEMP/conformance"
          hostname=$(node -p "require('$STACK/identity.json').hostname")
          key=$(node -p "require('$STACK/identity.json').enginePublicKey")
          NODE_EXTRA_CA_CERTS="$STACK/engine/dev-ca/ca-cert.pem" node packages/conformance/dist/ptbk-conformance.js \
            --base-url "https://$hostname:8443" --mock-control-url http://127.0.0.1:4480 --engine-public-key "$key" \
            --seed 1 --report junit --out conformance-report.xml
      - name: Show the stack's logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/conformance/relay.log" "$RUNNER_TEMP/conformance/mock-engine.log"
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: conformance-report.xml
          retention-days: 7
          if-no-files-found: ignore

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows with zizmor
        run: pipx run zizmor==1.30.1 --min-severity medium .github/workflows
