name: Windows terminal installation

on:
  pull_request:
    paths:
      - .github/workflows/windows-terminal-install.yml
      - apps/dashboard/src/domain/registration/install-scripts/install.ps1
      - apps/dashboard/scripts/test-windows-terminal-install.ps1
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-terminal-install.yml
      - apps/dashboard/src/domain/registration/install-scripts/install.ps1
      - apps/dashboard/scripts/test-windows-terminal-install.ps1

permissions:
  contents: read

jobs:
  powershell-51:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, pair and rerun in Windows PowerShell 5.1
        shell: powershell
        run: ./apps/dashboard/scripts/test-windows-terminal-install.ps1
