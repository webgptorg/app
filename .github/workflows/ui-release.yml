name: UI release

# A tag push is the only trigger: C-06 pins the Sigstore build trigger to `push`, so a dispatched run could never
# verify (decided 2026-10-20). `ui-v<package.json version>` builds and signs keylessly; `ui-v0.0.0-dryrun.<n>` does the
# same but is never uploaded. On GitHub Free there is no `release` environment to hold the release key and the R2
# token (decided 2026-11-09), so `publish` runs only when the repository variable UI_CI_PUBLISH is `true`; until then a
# maintainer downloads this run's `ui-bundle` and `ui-signatures` and signs, verifies and publishes from their machine
# (docs/runbooks/deploy.md, UI releases).
on:
  push:
    tags: ['ui-v*']

permissions: {}

concurrency:
  group: ui-release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to full commit SHAs and nothing is cached (spec, Security hardening item 10): a release is built
# only from the lockfile and the tagged commit. Each job gets only the permissions it needs.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
    defaults:
      run:
        working-directory: apps/engine-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Check the tag against package.json
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: bun run release:tag "$TAG" >> "$GITHUB_OUTPUT"
      - run: bun run check
        working-directory: .
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - run: bun run test:csp
      - name: Pack
        env:
          TAG: ${{ github.ref_name }}
        run: bun run pack --tag "$TAG"
      - name: Verify the archive is reproducible
        env:
          TAG: ${{ github.ref_name }}
        run: bun run verify-reproducible --tag "$TAG" --expect release/engine-ui.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-bundle
          path: |
            apps/engine-ui/release/engine-ui.tar.zst
            apps/engine-ui/release/manifest.json
          if-no-files-found: error
          retention-days: 7

  # The only job that can mint an OIDC token. sigstore-js signs with this workflow's identity, which C-06 pins
  # exactly (repository, repository ID, workflow path, tag, commit, GitHub-hosted runner, `push`).
  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # sigstore-js keyless signing (Fulcio certificate for this run)
    defaults:
      run:
        working-directory: apps/engine-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-bundle
          path: apps/engine-ui/release
      - name: Sign the archive and attest the release payload
        env:
          TAG: ${{ github.ref_name }}
        run: bun run release:attest --tag "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-signatures
          path: |
            apps/engine-ui/release/release-payload.json
            apps/engine-ui/release/release-provenance.sigstore.json
            apps/engine-ui/release/engine-ui.tar.zst.sigstore.json
          if-no-files-found: error
          retention-days: 7

  # The release environment (I-03) holds the release key and the R2 token for the release bucket only, and needs a
  # second maintainer's approval (required reviewers, no self-review, `ui-v*` tags only). Until the key ceremony it
  # holds the staging release key, which must never be in a production trust policy. Off until the org's plan has
  # environments: no deploy secret lives in GitHub before then.
  publish:
    needs: [build, sign]
    if: vars.UI_CI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/engine-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-bundle
          path: apps/engine-ui/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-signatures
          path: apps/engine-ui/release
      - name: Sign with the staging release key
        env:
          UI_RELEASE_KEY: ${{ secrets.UI_STAGING_RELEASE_KEY }}
        run: bun run release:sign
      - name: Verify against the staging trust policy
        run: bun run release:verify release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-release
          path: apps/engine-ui/release/release.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload to the staging bucket
        if: needs.build.outputs.dry_run == 'false'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          R2_ENDPOINT: ${{ vars.UI_STAGING_R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.UI_STAGING_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.UI_STAGING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.UI_STAGING_R2_SECRET_ACCESS_KEY }}
        run: bun run release:publish --version "$VERSION"
