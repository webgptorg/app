name: Nightly

# Every CI job on main, at most once a night, and the only CI main gets: pushes to main run nothing. It runs only if
# main moved since the last nightly that ran, passed or failed (scripts/ci-scope.ts nightly); a manual run of ci.yml
# retries an unchanged main.
on:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the commit of the last nightly that ran
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The latest finished nightly whose jobs all started: a job GitHub refused to start (billing) leaves the commit
      # unchecked. A night that skipped counts too, as it skipped only because its commit was checked before.
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=''
          while read -r id sha; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '.jobs | any(.name == "decide" and .conclusion == "success")
                and all(.conclusion != "failure" or (.steps | length) > 0)' | grep -qx true; then
              last=$sha
              break
            fi
          done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main --event schedule \
            --status completed --limit 30 --json databaseId,headSha,conclusion \
            --jq '.[] | select(.conclusion == "success" or .conclusion == "failure") | "\(.databaseId) \(.headSha)"')
          node scripts/ci-scope.ts nightly --last "$last"

  ci:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
