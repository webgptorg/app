version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One copy of @peculiar/asn1-schema only: its schema registry and instanceof checks break across copies, so the
      # ASN.1 packages and @peculiar/x509 move together.
      peculiar:
        patterns: ['@peculiar/*']
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only (ADR 0001); lift when it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The Workers test pool supports Vitest 4.1 only, and the plan pins Vitest 4.1 repo-wide (docs/plan/README.md,
      # Decisions); its @vitest/* packages must move with it. Lift when a Vitest 5 upgrade is its own task.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      # 3.x of @peculiar/* needs asn1-schema 3, but @simplewebauthn/server still requires x509 2 and asn1-* 2, so a
      # major would leave two copies. Lift when @simplewebauthn/server supports asn1-schema 3.
      - dependency-name: '@peculiar/*'
        update-types: ['version-update:semver-major']
      # Node types follow the runtime (Node 24 LTS), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
