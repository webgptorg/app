version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only (ADR 0001); lift when it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The Workers test pool supports Vitest 4.1 only; lift when it supports the next major.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      # Node types follow the runtime (Node 24 LTS), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
