# Local DNSSEC-validating resolver for the relay (I-01), so a spoofed answer cannot fake a custom hostname's CNAME
# check or an ACME validation. Validation comes from Debian's root trust anchor (root-auto-trust-anchor-file.conf).
server:
    interface: 127.0.0.1
    interface: ::1
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    hide-identity: yes
    hide-version: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    # harden-referral-path's extra queries exceed the default quota of 200 upstream queries per request on a cold
    # cache, so lookups after every restart failed with SERVFAIL (signed zones passed 1 of 12 fresh starts; 400: 9 of
    # 12; 1000: 36 of 36). It still bounds the work one query can cause.
    max-global-quota: 1000
    prefetch: yes
